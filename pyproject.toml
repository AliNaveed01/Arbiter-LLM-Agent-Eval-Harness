[project]
name = "agentgauge-eval"
dynamic = ["version"]
description = "Regression testing for LLM agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.16.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
agentgauge = "agentgauge.cli:app"

[project.urls]
Homepage = "https://github.com/AliNaveed01/agentgauge"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pyright",
    "pre-commit",
    "types-pyyaml>=6.0.12.20261030",
    "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/agentgauge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgauge"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=agentgauge --cov-report=term-missing"

[tool.coverage.run]
source = ["agentgauge"]
branch = true
