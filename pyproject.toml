[project]
name = "agentgauge"
dynamic = ["version"]
description = "Regression testing for LLM agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://github.com/AliNaveed01/Arbiter-LLM-Agent-Eval-Harness"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pyright",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/agentgauge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgauge"]
