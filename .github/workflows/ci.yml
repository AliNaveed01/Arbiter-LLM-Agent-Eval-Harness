name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --python ${{ matrix.python-version }}
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest --cov-report=xml
      - name: Check for tool trailers in commit messages
        if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
        run: |
          if git log --format=%B origin/${{ github.base_ref }}..HEAD | grep -iE '^(co-authored-by:.*(claude|anthropic)|claude-session:)|generated with .*claude'; then
            echo "Commit messages must not carry tool attribution." >&2
            exit 1
          fi
