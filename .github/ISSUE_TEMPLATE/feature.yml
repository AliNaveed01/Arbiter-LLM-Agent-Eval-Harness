name: Feature
description: Propose a new feature or enhancement
title: "feat: "
labels: ["type:feat"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should be built and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist of conditions that must hold when this is done.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Design notes, alternatives considered, related issues.
