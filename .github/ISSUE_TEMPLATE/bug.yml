name: Bug
description: Report something that is broken
title: "fix: "
labels: ["type:fix"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Actual versus expected behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agentgauge version
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python version, provider.
